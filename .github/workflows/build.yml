name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Validate project
        run: |
          test -f settings.gradle || (echo "settings.gradle missing" && exit 1)
          test -f build.gradle || (echo "build.gradle missing" && exit 1)
          test -f src/main/resources/fabric.mod.json || (echo "fabric.mod.json missing" && exit 1)

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Confirm JAR
        if: always()
        run: |
          ls -la build/libs/ || (echo "no build/libs" && exit 1)
          JAR_FOUND=0
          for jar in build/libs/easymace-*.jar; do
            [ -e "$jar" ] || continue
            case "$jar" in
              *-sources.jar) ;;
              *) JAR_FOUND=1; test -s "$jar" ;;
            esac
          done
          [ "$JAR_FOUND" = "1" ] || (echo "no jar found" && exit 1)

      - name: Upload JAR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easymace-26.3-jar
          path: build/libs/*.jar
          if-no-files-found: error
